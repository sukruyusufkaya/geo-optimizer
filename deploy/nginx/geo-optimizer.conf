# nginx site for GEO Optimizer Web.
#
# Install as HTTP-only, then let certbot add the TLS block and the redirect:
#   sudo cp deploy/nginx/geo-optimizer.conf /etc/nginx/sites-available/geo-optimizer
#   sudo ln -sf /etc/nginx/sites-available/geo-optimizer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN -d www.DOMAIN
#
# Replace DOMAIN with the real hostname before installing.

# Per-IP limiter for the audit endpoints: each audit makes the server fetch a
# remote page, so an unthrottled /api/audit is an outbound-traffic amplifier.
limit_req_zone $binary_remote_addr zone=geo_api:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    client_max_body_size 2m;

    # Audits fetch and parse a third-party page; PDF rendering is slower still.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml text/markdown;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # burst lets a normal user run a few audits back to back; nodelay keeps
        # those first few fast instead of queueing them.
        limit_req zone=geo_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
