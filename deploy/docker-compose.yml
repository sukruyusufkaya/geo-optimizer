# GEO Optimizer Web — production stack for a single VPS.
#
# The container listens only on loopback: nginx on the host terminates TLS and
# proxies to it, so the app port is never exposed to the internet directly.
#
#   cd /opt/geo-optimizer && docker compose -f deploy/docker-compose.yml up -d --build

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: geo-optimizer-web:latest
    container_name: geo-optimizer-web
    restart: unless-stopped
    # 127.0.0.1 binding is deliberate — see the header note.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    # The runtime image has no curl/wget, so the probe goes through Python.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
